name: StockDiary
options:
  bundleIdPrefix: com.stockdiary
  xcodeVersion: "16.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  StockDiary_macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shared
      - path: macOS
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: StockDiary
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockdiary.StockDiary
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: StockDiary
    entitlements:
      path: StockDiary.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.stockdiary.StockDiary
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.stockdiary.StockDiary
  StockDiary_iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: iOS
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: StockDiary
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockdiary.StockDiary
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: StockDiary
    entitlements:
      path: StockDiary.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.stockdiary.StockDiary
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.stockdiary.StockDiary
