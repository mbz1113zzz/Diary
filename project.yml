name: StockDiary
options:
  bundleIdPrefix: com.stockdiary
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  StockDiary:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Shared
      - path: iOS
        excludes:
          - "**/*"
        platform: [iOS]
      - path: iOS
        platform: [iOS]
      - path: macOS
        excludes:
          - "**/*"
        platform: [macOS]
      - path: macOS
        platform: [macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockdiary.StockDiary
        INFOPLIST_KEY_CFBundleDisplayName: StockDiary
    entitlements:
      path: StockDiary.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.stockdiary.StockDiary
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.stockdiary.StockDiary
