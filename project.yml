name: StockDiary
options:
  bundleIdPrefix: com.stockdiary
  xcodeVersion: "16.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: "0.8.0"
targets:
  StockDiary_macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shared
      - path: macOS
    dependencies:
      - package: swift-markdown
        product: Markdown
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: StockDiary
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSTemporaryExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockdiary.StockDiary
        PRODUCT_NAME: StockDiary
  StockDiary_iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - package: swift-markdown
        product: Markdown
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: StockDiary
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSTemporaryExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockdiary.StockDiary
        PRODUCT_NAME: StockDiary
  StockDiary_macOSTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: StockDiary_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockdiary.StockDiaryTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/StockDiary.app/Contents/MacOS/StockDiary
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  StockDiary_macOS:
    build:
      targets:
        StockDiary_macOS: all
    test:
      targets:
        - StockDiary_macOSTests
  StockDiary_iOS:
    build:
      targets:
        StockDiary_iOS: all
